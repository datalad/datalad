# Job configurations for `.github/workflows/test.yml`
#
# Splitting these out into a separate file seems to be the only sane way to
# conditionally filter out jobs that should only be run on cron; cf.
# <https://stackoverflow.com/q/65384420/744178>.
#
# Conventions, all of them deliberate (see docs/testing-speedup-proposal.md):
#
# * every entry runs the whole suite except `@turtle`.  There used to be a
#   "not slow" / "slow only" split per scenario; a full run now costs about
#   what the "not slow" half used to, so one job per scenario covers more for
#   the same money.  Scope a job with TESTS_TO_PERFORM if it really needs a
#   subset.
# * `@turtle` is covered by exactly one entry, which runs *only* those.  The
#   old per-scenario PYTEST_SELECTION/PYTEST_SELECTION_OP knob is still gone;
#   PYTEST_MARKERS exists for this one job, and overriding it elsewhere would
#   just re-create the split that was removed.
# * git-annex comes from the PyPI wheel unless the entry says otherwise, which
#   is both the fastest to install and unwrapped (worth 2-3x on test runtime
#   over the standalone bundle).  The bundle and the conda package are
#   *packaging* variants of the same git-annex and are covered on cron.
# * the Python sweep on PRs is the base supported version and the newest one;
#   the versions in between run on cron.
# * `os` is the `runs-on` label; entries without it default to `ubuntu-latest`
#   (see the `filter` job in test.yml).

# ---------------------------------------------------------------- PR + cron --

# The plain one.  Also the trial entry for a higher worker count: the runners
# report 4 CPUs, and 4 workers measured 1.65x over 2 locally with no change in
# outcome.  Roll PYTEST_NPROC out further once this has been green for a while.
- python-version: '3.10'
  extra-envs:
    PYTEST_NPROC: "4"

# The only entry that runs `@turtle` -- everything else is `not(turtle)`, so
# without this they would never run anywhere.  Base Python, plain ubuntu, the
# default PyPI git-annex: nothing scenario-specific, because the point is to
# exercise the tests themselves rather than an environment.
#
# It is cheap enough to keep on PRs rather than cron: 3 tests, ~2 min of test
# time (test_files_split_heavy is 15 s + 108 s, test_gitannex_ssh needs the
# sshd that DATALAD_TESTS_SSH already provisions).  If it ever stops being
# cheap, add `cron-only: true` rather than dropping it -- a marker nothing
# runs is a marker that quietly rots.
- python-version: '3.10'
  extra-envs:
    PYTEST_MARKERS: turtle

# To test https://github.com/datalad/datalad/pull/4342 fix.
# From our testing in that PR seems to have no effect, but kept around
# since should not hurt.
- python-version: '3.10'
  extra-envs:
    LC_ALL: ru_RU.UTF-8

# Newest Python we claim to support.
- python-version: '3.14'
  extra-envs: {}

# SSH connection multiplexing off, and pathspecs passed via a file.
# LANG here for the same reason as LC_ALL above, on the other half of the
# scenarios these two entries used to be split into.
- python-version: '3.10'
  extra-envs:
    DATALAD_SSH_MULTIPLEX__CONNECTIONS: "0"
    DATALAD_RUNTIME_PATHSPEC__FROM__FILE: always
    LANG: bg_BG.UTF-8

# Tricky TMPDIR (a symlink) with leading-dash filenames for the most challenge.
- python-version: '3.10'
  extra-envs:
    _DL_TMPDIR: "/var/tmp/sym link"
    DATALAD_TESTS_OBSCURE_PREFIX: "-"
    DATALAD_LOG_TRACEBACK: collide  # just a smoke test for now

# A run loaded with various customizations to smoke test those functionalities.
# Apparently moving symlink outside has different effects on abspath
# See https://github.com/datalad/datalad/issues/878
- python-version: '3.10'
  extra-envs:
    # eventually: _DL_TMPDIR: "/var/tmp/sym ссылка"
    _DL_TMPDIR: "/var/tmp/sym link"
    DATALAD_TESTS_OBSCURE_PREFIX: "-"
    # By default no logs will be output. This one is to test with log
    # output at INFO level
    DATALAD_LOG_LEVEL: INFO
    DATALAD_LOG_TRACEBACK: "1"  # just a smoke test for now
    DATALAD_LOG_VMEM: "1"
    DATALAD_RUNTIME_MAX__BATCHED: "2"
    DATALAD_RUNTIME_MAX__INACTIVE__AGE: "10"

- python-version: '3.10'
  extra-envs:
    # By default no logs will be output. This one is to test with low level but
    # dumped to /dev/null
    DATALAD_LOG_LEVEL: "2"
    DATALAD_LOG_TARGET: "/dev/null"
    DATALAD_TESTS_PROTOCOLREMOTE: "1"
    DATALAD_TESTS_DATALADREMOTE: "1"
    DATALAD_LOG_CWD: "1"
    DATALAD_LOG_OUTPUTS: "1"
    DATALAD_LOG_ENV: "1"
    DATALAD_LOG_STDIN: "1"
    DATALAD_TESTS_UI_BACKEND: console
    DATALAD_TESTS_OBSCURE_PREFIX: "-"
    DATALAD_SEED: "1"
    GIT_AUTHOR_DATE: "Thu, 07 Apr 2005 22:13:13 +0200"
    GIT_AUTHOR_NAME: blah
    GIT_AUTHOR_EMAIL: committer@example.com
    GIT_COMMITTER_DATE: "Thu, 07 Apr 2005 22:13:13 +0200"
    GIT_COMMITTER_NAME: blah
    GIT_COMMITTER_EMAIL: committer@example.com

# Test some under NFS mount  (only selected sub-set)
- python-version: '3.10'
  extra-envs:
    # do not run SSH-based tests due to stall(s)
    # https://github.com/datalad/datalad/pull/4172
    DATALAD_TESTS_SSH: "0"
    _DL_TMPDIR: "/tmp/nfsmount"
    PYTEST_FAIL_SLOW: 1200
    TESTS_TO_PERFORM: "datalad.tests datalad.support"

# macOS and Windows.  Each platform is split into three module groups the way
# AppVeyor's Mac/WinP310core/a1/a2 jobs used to be, to keep any one job
# comfortably under the runner's timeout.

- python-version: '3.10'
  os: macos-latest
  extra-envs:
    TESTS_TO_PERFORM: "datalad.core datalad.dataset datalad.runner datalad.support"

- python-version: '3.10'
  os: macos-latest
  extra-envs:
    TESTS_TO_PERFORM: >-
      datalad.cli datalad.customremotes datalad.distribution
      datalad.downloaders datalad.interface datalad.tests datalad.ui

- python-version: '3.10'
  os: macos-latest
  extra-envs:
    TESTS_TO_PERFORM: "datalad.local datalad.distributed"

- python-version: '3.10'
  os: windows-2022
  extra-envs:
    TESTS_TO_PERFORM: "datalad.core datalad.dataset datalad.runner"

- python-version: '3.10'
  os: windows-2022
  extra-envs:
    TESTS_TO_PERFORM: >-
      datalad.cli datalad.customremotes datalad.distribution
      datalad.distributed datalad.downloaders datalad.interface
      datalad.tests

- python-version: '3.10'
  os: windows-2022
  extra-envs:
    TESTS_TO_PERFORM: "datalad.local datalad.support datalad.ui"

# --------------------------------------------------------------- cron only --

# The Python versions between the base supported one and the newest.
- python-version: '3.12'
  cron-only: true
  extra-envs:
    DATALAD_REPO_VERSION: "10"
    DATALAD_TESTS_GITCONFIG: "\n[annex]\n stalldetection = 1KB/120s\n"

- python-version: '3.13'
  cron-only: true
  extra-envs: {}

# The standalone bundle -- what most users get from NeuroDebian,
# datalad-installer's defaults or conda.  Keeps `runshell`, the bundled `git`
# and the LOCPATH/GIT_EXEC_PATH behaviour under test.  12 s to install.
- python-version: '3.10'
  cron-only: true
  extra-envs:
    _DL_ANNEX_INSTALL_SCENARIO: "git-annex -m datalad/packages"

# git-annex from the conda-forge package, via pixi (3 s; miniconda took
# minutes and datalad-installer now deprecates that component anyway).
- python-version: '3.10'
  cron-only: true
  extra-envs:
    _DL_ANNEX_INSTALL_SCENARIO: "pixi"

# The minimum git-annex we announce support for, as defined in
# AnnexRepo.GIT_ANNEX_MIN_VERSION -- not published as a PyPI wheel (those start
# at 10.20250605), so this is the one entry that has to come from conda-forge.
# Natural place to grow a full minimal-dependencies job later, pinning the
# lowest supported versions of the Python dependencies too.
- python-version: '3.10'
  cron-only: true
  extra-envs:
    _DL_ANNEX_INSTALL_SCENARIO: "pixi==10.20230126"

# Run with git's master branch rather the default one on the system.
- python-version: '3.10'
  cron-only: true
  upstream-git: true
  extra-envs:
    DATALAD_USE_DEFAULT_GIT: "1"

# Run with our reported minimum Git version.
- python-version: '3.10'
  cron-only: true
  minimum-git: true
  extra-envs:
    DATALAD_USE_DEFAULT_GIT: "1"

- python-version: '3.10'
  cron-only: true
  extra-envs:
    # to test operation under root since also would consider FS "crippled" due
    # to ability to rewrite R/O files
    PYTEST_WRAPPER: "sudo -E"
    # no key authentication for root:
    DATALAD_TESTS_SSH: "0"

- python-version: '3.10'
  cron-only: true
  extra-envs:
    DATALAD_TESTS_NONETWORK: "1"
    # must operate nicely with those env variables set
    http_proxy: ""
    https_proxy: ""

# Test under NFS mount (the complement of the scoped NFS job above --
# everything except datalad.tests and datalad.support, which are already
# covered there). The previous "full" NFS job ran the entire suite and was
# cancelled by GitHub's 6h job timeout on every scheduled run.
- python-version: '3.10'
  cron-only: true
  allow-failure: true
  extra-envs:
    # give much more time to complete on NFS
    _DL_TMPDIR: "/tmp/nfsmount"
    PYTEST_FAIL_SLOW: 1200
    TESTS_TO_PERFORM: "datalad.cli datalad.cmdline datalad.core datalad.customremotes datalad.dataset datalad.distributed datalad.distribution datalad.downloaders datalad.interface datalad.local datalad.plugin datalad.runner datalad.ui"

