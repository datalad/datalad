name: Test

on:
  pull_request:
    # `ready_for_review` so that taking a PR out of draft re-runs the suite
    # with coverage enabled (see the `Run tests` step).  The reverse
    # transition has no event, so flipping back to draft costs nothing.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [ 'master', 'maint' ]
  schedule:
    - cron: '0 6 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref_name }}
  cancel-in-progress: true

defaults:
  run:
    # Use an interactive shell so that ~/.bashrc is sourced:
    shell: 'bash -eio pipefail {0}'

env:
   # A stall guard rather than a "needs @slow annotation" lint: with nothing
   # but @turtle excluded, a test legitimately taking a couple of minutes is
   # not a mistake, but one taking 5 is stuck.
   PYTEST_FAIL_SLOW: 300
   # pytest-xdist workers.  Not `auto`: os.cpu_count() reports the machine's
   # CPUs rather than the runner's quota, and the macOS/Windows runners are
   # sized differently.  Override per matrix entry.
   PYTEST_NPROC: 2
   DATALAD_TESTS_SSH: "1"
   DATALAD_LOG_ENV: GIT_SSH_COMMAND
   # How/which git-annex we install.  "pypi" (the git-annex wheel, maintained
   # by mih) is the fastest to install and the only method that is identical
   # on all three platforms; it is also unwrapped, which is worth 2-3x on test
   # runtime over the standalone bundle that `-m conda`/`-m datalad/packages`
   # deliver.  See docs/testing-speedup-proposal.md.  Other scenarios are
   # handed to datalad-installer as before.
   _DL_ANNEX_INSTALL_SCENARIO: "pypi"
   BOTO_CONFIG: /tmp/nowhere
   DATALAD_DATASETS_TOPURL: https://datasets-tests.datalad.org

jobs:
  filter:
    runs-on: ubuntu-latest
    outputs:
      jobs: ${{ steps.jobs.outputs.matrix }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Possibly filter out cron-only jobs
        id: jobs
        run: |
          echo 'matrix<<EOT' >> "$GITHUB_OUTPUT"
          # Entries in tools/ci/test-jobs.yml default to Linux; fill in
          # `os` (the `runs-on` label) for the ones that don't say
          # otherwise, so the `test` job below can key off it directly.
          if [ "${{ github.event_name == 'schedule' }}" = true ]
          then
              yq '{"include": [.[] | .os |= (. // "ubuntu-latest")]} | to_json' tools/ci/test-jobs.yml >> "$GITHUB_OUTPUT"
          else
              yq '{"include": [.[] | select(."cron-only" != true) | .os |= (. // "ubuntu-latest")]} | to_json' tools/ci/test-jobs.yml >> "$GITHUB_OUTPUT"
          fi
          echo 'EOT' >> "$GITHUB_OUTPUT"

  test:
    runs-on: ${{ matrix.os }}
    needs: filter
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.filter.outputs.jobs) }}
    env: ${{ matrix.extra-envs }}
    continue-on-error: ${{ matrix.allow-failure || false }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # Do full clone (~10 extra seconds) to fetch all tags.
          # Otherwise we might be missing the tags for maint PRs
          # whenever those maint releases were not yet merged into master.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Show git describe output to ensure that we did fetch all the tags
        run: git describe

      # OS-specific provisioning (APT/NeuroDebian on Linux, Homebrew on
      # macOS, long paths/SSH server on Windows) lives in
      # tools/ci/test-env-{linux,macos,windows}.sh rather than inline here,
      # so it can be shellchecked (.github/workflows/shellcheck.yml) like
      # other tools/ci scripts. $RUNNER_OS is 'Linux'/'macOS'/'Windows';
      # lowercased, that's exactly those three filenames.
      - name: Provision OS-specific test environment
        run: tools/ci/test-env-"$(echo "$RUNNER_OS" | tr '[:upper:]' '[:lower:]')".sh
        env:
          NEEDS_NEURODEBIAN: ${{ matrix.needs-neurodebian || false }}

      - name: Configure _DL_TMPDIR before installing git-annex
        run: |
          if [[ "${_DL_TMPDIR:-}" =~ .*/sym\ link ]]
          then echo "Symlinking $_DL_TMPDIR"
               ln -s /tmp "$_DL_TMPDIR"
          fi

          if [[ "${_DL_TMPDIR:-}" =~ .*/d\ i\ r ]]
          then echo "mkdir $_DL_TMPDIR"
               mkdir -p "$_DL_TMPDIR"
          fi

          if [[ "${_DL_TMPDIR:-}" =~ .*/nfsmount ]]
          then echo "mkdir $_DL_TMPDIR"
               mkdir -p "$_DL_TMPDIR" "${_DL_TMPDIR}_"
               # `(rw)` alone defaults to `sync` on the NFS server side, which
               # round-trips every git/git-annex fsync through nfsd and pushes
               # the chunk-1 / chunk-2 NFS test jobs into the GH Actions 6h
               # job timeout (cron 25434940670 / PR #7852).  `async` lets the
               # server ack writes once they are in cache instead of after
               # they reach disk; we are testing on an ephemeral runner so
               # the durability tradeoff is irrelevant.  See PR #7852.
               echo "/tmp/nfsmount_ localhost(rw,async)" | sudo bash -c 'cat - > /etc/exports'
               sudo apt-get install -y nfs-kernel-server
               sudo exportfs -a
               sudo mount -t nfs localhost:/tmp/nfsmount_ /tmp/nfsmount
          fi

      - name: Install custom Git from upstream
        if: matrix.upstream-git
        run: |
          sudo apt-get install -y gettext libcurl4-gnutls-dev
          source tools/ci/install-upstream-git.sh
          echo "$target_dir/bin-wrappers" >> "$GITHUB_PATH"

      - name: Install minimum Git
        if: matrix.minimum-git
        run: |
          sudo apt-get install -y gettext libcurl4-gnutls-dev
          tools/ci/install-minimum-git.sh
          echo "$PWD/git-src/bin-wrappers" >> "$GITHUB_PATH"

      - name: Install git-annex
        run: |
          scriptdir=
          case "$_DL_ANNEX_INSTALL_SCENARIO" in
            pypi*)
              # "pypi", or "pypi==10.20260901.post1" to pin a version
              pip install "git-annex${_DL_ANNEX_INSTALL_SCENARIO#pypi}"
              scriptdir=$(python -c 'import sysconfig; print(sysconfig.get_path("scripts"))')
              ;;
            pixi*)
              # The conda-forge package, but reached via pixi: ~3 s instead of
              # miniconda's minutes, and it puts every shim in one bin dir.
              # Linux/x86_64 only, which is all the conda entry needs.
              # Everything lands outside the checkout -- a .pixi/ inside it
              # would show up as untracked cruft to the tests themselves.
              pixidir="${RUNNER_TEMP:-$HOME}/pixi"
              mkdir -p "$pixidir"
              curl -fsSL -o "$pixidir/pixi.tar.gz" \
                https://github.com/prefix-dev/pixi/releases/latest/download/pixi-x86_64-unknown-linux-musl.tar.gz
              tar -xzf "$pixidir/pixi.tar.gz" -C "$pixidir" pixi
              PIXI_HOME="$pixidir/home" "$pixidir/pixi" global install \
                "git-annex${_DL_ANNEX_INSTALL_SCENARIO#pixi}"
              scriptdir="$pixidir/home/bin"
              ;;
            *)
              pip install datalad-installer
              eval datalad-installer --sudo ok -E new.env ${_DL_ANNEX_INSTALL_SCENARIO}
              # Append new.env to ~/.bashrc instead of $GITHUB_OUTPUT because it
              # can include `source` and `conda activate` commands that are invalid
              # for the latter; this also necessitates using an interactive shell
              # for the workflow.
              cat new.env >> ~/.bashrc
              ;;
          esac

          # A non-interactive sshd session (which DATALAD_TESTS_SSH=1 tests
          # go through, via SSHConnection.get_annex_installdir()) and `sudo -E`
          # see neither $GITHUB_PATH nor ~/.bashrc, but do see /usr/local/bin.
          if [ -n "$scriptdir" ]
          then
            echo "$scriptdir" >> "$GITHUB_PATH"
            if [ "$RUNNER_OS" != Windows ]
            then
              for prog in git-annex git-annex-shell git-remote-annex git-remote-tor-annex
              do
                if [ -e "$scriptdir/$prog" ]
                then sudo ln -sf "$scriptdir/$prog" /usr/local/bin/
                fi
              done
            fi
          fi
          # $GITHUB_PATH only takes effect in *later* steps, so put $scriptdir
          # on this step's own PATH too -- otherwise the check below reports
          # whatever git-annex happened to be there already rather than the one
          # just installed.  Which one ends up in play is the whole point of
          # this step, so say it out loud instead of leaving it to be inferred
          # from a later failure.
          if [ -n "$scriptdir" ]
          then PATH="$scriptdir:$PATH"
          fi
          command -v git-annex
          git-annex version | head -2

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip uv
          # Target this job's interpreter explicitly.  `uv pip install
          # --system` picks *a* system interpreter rather than the one on
          # PATH, and on macOS runners that is Homebrew's python@3.14 (pulled
          # in by `brew install` during provisioning), which is
          # externally-managed (PEP 668) and refuses the install outright.
          uv pip install --system \
            --python "$(python -c 'import sys; print(sys.executable)')" \
            -r requirements-devel.txt

      - name: Configure Git
        run: |
          git config --global user.email "test@github.land"
          git config --global user.name "GitHub Almighty"

      # Now it should be safe to point TMPDIR to a "tricky" setup just for the
      # purpose of testing
      - name: Point TMPDIR to "tricky" setup
        run: |
          if [ -n "${_DL_TMPDIR:-}" ]
          then echo TMPDIR="${_DL_TMPDIR}" >> "$GITHUB_ENV"
          fi

      - name: Test installation for user
        run: |
          # Only Linux's provisioning (tools/ci/test-env-linux.sh) sets up
          # `sudo` to keep PATH and git's safe.directory happy; elsewhere
          # there's nothing to elevate for.
          if [ "$RUNNER_OS" = Linux ]
          then sudo pip install --user .
          else pip install --user .
          fi

      - name: Report WTF information using system-wide installed version
        run: |
          datalad wtf
          python -m pip freeze

      - name: Run tests
        run: |
          PYTEST_OPTS=( -v --durations=0 --durations-min=5
                        --fail-slow "$PYTEST_FAIL_SLOW" )

          # Coverage costs ~39% of test runtime, so collect it where somebody
          # reads it and skip it where nobody does: the upload below never
          # happens on `schedule`, and a draft PR's codecov annotation is not
          # being looked at yet.  `ready_for_review` in this workflow's
          # triggers re-runs the suite with coverage on once the PR is up for
          # review.  Nothing about *which tests run* changes either way.
          COVERAGE=1
          if [ "${{ github.event_name }}" = schedule ] \
             || [ "${{ github.event.pull_request.draft }}" = true ]
          then COVERAGE=0
          fi
          echo "COVERAGE=$COVERAGE" >> "$GITHUB_ENV"
          if [ "$COVERAGE" = 1 ]
          then PYTEST_OPTS=( "${PYTEST_OPTS[@]}" --cov=datalad --cov-report=xml )
          fi

          mkdir -p __testhome__
          cd __testhome__
          # Note: adding --log-cli-level=INFO would result in
          # DATALAD_LOG_TARGET=/dev/null being not in effect, dumping too many
          # logs.
          set -x
          http_proxy=
          # The coverage-bin wrappers re-exec datalad's entry points under
          # `coverage run`, so they are only useful when collecting coverage.
          # They are bash scripts relying on a POSIX shebang being honored on
          # exec -- true for Linux/macOS but not for Windows (this also
          # matches how AppVeyor ran things: its Windows jobs never used this
          # wrapper either).
          if [ "$COVERAGE" = 1 ] && [ "$RUNNER_OS" != Windows ]
          then PATH=$PWD/../tools/coverage-bin:$PATH
          fi
          $PYTEST_WRAPPER python \
            -m pytest "${PYTEST_OPTS[@]}" \
            -c ../tox.ini \
            -n "$PYTEST_NPROC" \
            -m "not(turtle)" \
            --doctest-modules \
            --report-log=pytest-report.jsonl \
            --pyargs ${TESTS_TO_PERFORM:-datalad}

      # pytest-reportlog writes one JSON object per test event (collect, call,
      # teardown, ...).  Uploading on `always()` means timings survive even
      # when the job is cancelled by the GH Actions 6h job timeout (which is
      # what happens to the heavier NFS chunks); the file is line-delimited
      # so the partial dump up to the last completed test is parseable.
      - name: Upload pytest report log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-report-${{ github.run_id }}-${{ strategy.job-index }}
          path: __testhome__/pytest-report.jsonl
          if-no-files-found: ignore
          retention-days: 7

      # Makes it only more difficult to comprehend the failing output.  Enable
      # only when necessary for a particular debugging.
      - name: Dump debug info
        #if: "failure()"  # Enabled
        if: "failure() && false"  # Disabled
        run: |
          if [ ! -z "$DATALAD_TESTS_NONETWORK" ]
          then sudo route add -net 0.0.0.0 netmask 0.0.0.0 dev lo
          fi

          DATALAD_LOG_LEVEL=DEBUG \
            $PYTEST_WRAPPER `which pytest` \
            -s -v --doctest-modules --cov datalad --log-cli-level=DEBUG

          if [ ! -z "$DATALAD_TESTS_NONETWORK" ]
          then sudo route del -net 0.0.0.0 netmask 0.0.0.0 dev lo
          fi

      # cron jobs test more and then PRs will be falling behind since they
      # would not trigger some codepaths.  So submit coverage only from
      # non-cron jobs, but report for all

      - name: Report coverage
        if: env.COVERAGE == '1'
        run: |
          python -m coverage debug sys
          python -m coverage report
        working-directory: __testhome__

      - name: Upload coverage to Codecov
        if: env.COVERAGE == '1'
        uses: codecov/codecov-action@v7
        with:
          directory: __testhome__
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

