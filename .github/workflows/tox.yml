# Runs the non-pytest `tox` environments, i.e. the checks which can be
# reproduced locally with a plain `tox -e <env>`.  Each environment gets its
# own matrix job so that a failure shows up as its own, clearly named check on
# the pull request.
#
# The pytest run itself is not here: it needs git-annex and a substantially
# heavier setup, and lives in test.yml.
name: tox

on:
  pull_request:
  push:
    branches: ['master', 'maint']

jobs:
  tox:
    name: ${{ matrix.env }}

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        env: [lint, typing]

    steps:
    - name: Set up environment
      uses: actions/checkout@v7
      with:  # versioneer needs the tags to derive a version for the
             # environments which install datalad (e.g. typing)
        fetch-depth: 0
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # tox-uv to speed up creation of the environments, as recommended in
        # CONTRIBUTING.md for local runs
        python -m pip install --upgrade tox tox-uv
    - name: Run tox -e ${{ matrix.env }}
      run: tox -e ${{ matrix.env }}
