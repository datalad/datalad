name: Benchmarks

on:
  pull_request:
  push:
    branches: ['master', 'maint']

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  vs-master:

    runs-on: ubuntu-latest

    env:
      # Benchmarks which changed by more than this factor (and significantly
      # so) are reported; the job fails if any of them got slower, or if any
      # benchmark fails.
      BENCHMARK_FACTOR: "1.2"

    steps:
    - name: Set up system
      shell: bash
      run: |
        bash <(wget -q -O- https://neuro.debian.net/_files/neurodebian-ci-setup.sh)
        sudo apt-get update -qq
        sudo apt-get install -y eatmydata
        sudo eatmydata apt-get install -y git-annex-standalone
    - name: Set up environment
      run: |
        git config --global user.email "test@github.land"
        git config --global user.name "GitHub Almighty"
        # Prevent interactive credential entry
        # See also the GIT_ASKPASS env var below
        git config --global core.askPass ""

    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Set up Python 3.10
      uses: actions/setup-python@v7
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        # devel-utils provides asv, making `pip install asv` in
        # tools/ci/benchmark-travis-pr.sh a no-op
        pip install ".[devel-docs,devel-utils]"
        # for the `ls` benchmarks
        pip install datalad_deprecated
    - name: Run benchmarks
      env:
        # fake environment to be able to reuse script for travis
        TRAVIS_PULL_REQUEST: true
        # Prevent interactive credential entry (note "true" is the command to run)
        GIT_ASKPASS: true

      run: |
        tools/ci/benchmark-travis-pr.sh
    - name: Compare
      # bash with pipefail, so tee does not hide a failure of asv compare
      shell: bash
      run: |
        asv compare --split --factor "$BENCHMARK_FACTOR" \
          refs/bm/merge-target refs/bm/pr | tee asv-compare.txt
    - name: Summarize
      id: report
      env:
        BEFORE_LABEL: ${{ github.event_name == 'pull_request' && github.base_ref || 'the parent' }}
        AFTER_LABEL: ${{ github.event_name == 'pull_request' && 'this PR' || 'this commit' }}
      run: |
        mkdir benchmarks-report
        python tools/ci/benchmark-report.py --factor "$BENCHMARK_FACTOR" \
          --before-label "$BEFORE_LABEL" --after-label "$AFTER_LABEL" \
          --notes benchmark-notes.txt --github-output "$GITHUB_OUTPUT" \
          asv-compare.txt > benchmarks-report/report.md
        cat benchmarks-report/report.md >> "$GITHUB_STEP_SUMMARY"
    # This workflow cannot comment on PRs from forks, since it gets a
    # read-only token for them.  The report is posted to the PR by the
    # benchmarks-comment workflow instead.
    - name: Store report for PR comment
      if: github.event_name == 'pull_request'
      env:
        PR_NUMBER: ${{ github.event.pull_request.number }}
        NOTABLE: ${{ steps.report.outputs.notable }}
      run: |
        echo "$PR_NUMBER" > benchmarks-report/pr-number
        echo "$NOTABLE" > benchmarks-report/notable
    - name: Upload report
      if: github.event_name == 'pull_request'
      uses: actions/upload-artifact@v7
      with:
        name: benchmarks-report
        path: benchmarks-report/
        retention-days: 7
    - name: Fail if any benchmarks have slowed down too much or fail
      env:
        SLOWER: ${{ steps.report.outputs.slower }}
        FAILING: ${{ steps.report.outputs.failing }}
      run: |
        if [ "$SLOWER" != 0 ] || [ "$FAILING" != 0 ]; then
          echo "::error::Benchmarks slower by more than a factor of $BENCHMARK_FACTOR: $SLOWER, failing: $FAILING. See the job summary."
          exit 1
        fi
